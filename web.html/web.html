```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden; /* No scrolling */
    font-family:Arial, sans-serif;
}

body{
    background:url("background.jpg") no-repeat center center/cover;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
    background:rgba(0,0,0,0.5);
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.hero{
    height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    background:rgba(0,0,0,0.3);
}

.hero h1{
    font-size:60px;
}

.hero p{
    font-size:22px;
    margin:15px 0;
}

button{
    padding:12px 30px;
    font-size:18px;
    border:none;
    border-radius:5px;
    background:#2196F3;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}
</style>
</head>

<body>

<nav>
    <div class="logo">My Website</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>Welcome</h1>
    <p>Create beautiful websites using HTML and CSS.</p>
    <button>Get Started</button>
</section>

</body>
</html>
```
